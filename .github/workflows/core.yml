name: core
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The declared Times New Roman files are proprietary and are not fetched
      # here: the figure step runs every data check and compares the generated
      # table rows, and records PDF byte comparison as unavailable.
      - run: python -m pip install -r requirements-figures.txt
      - run: python -B review.py --scope core --output "$RUNNER_TEMP/review"
      - run: python -B -m unittest tests.test_review_entrypoint
      - run: python -B run_campaign.py --output "$RUNNER_TEMP/campaign"
