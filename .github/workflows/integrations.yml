name: integrations
on:
  workflow_dispatch:
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -B evaluate.py --profile framework --output "$RUNNER_TEMP/framework"
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-query.txt
      - run: python -B evaluate.py --profile query --output "$RUNNER_TEMP/query"
